name: Check Replies

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: pip install requests

      - run: python check_replies.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
